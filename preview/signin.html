<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Race to Abs — sign in preview</title>
<link rel="stylesheet" href="../styles.css" />
</head>
<body>
  <div class="view view-center">
    <div class="brand-mark">
      <div class="logo-ring"><span>RA</span></div>
      <h1 class="brand-name">Race to Abs</h1>
      <p class="tagline">30 days. Daily check-ins. May the best discipline win.</p>
    </div>
    <div class="card narrow">
      <h2>Sign in</h2>
      <p class="muted">We'll email you a one-tap login link.</p>
      <form>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="you@email.com" value="sarah@example.com" />
        </div>
        <button type="button" class="btn-primary">Send magic link</button>
      </form>
    </div>
  </div>
</body>
</html>
