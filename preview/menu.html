<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Race to Abs — menu</title>
<link rel="stylesheet" href="../styles.css" />
<style>
  *, *::before, *::after { animation-duration: 0s !important; animation-delay: 0s !important; transition: none !important; }
  body { padding: 1rem; }
  .preview-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    box-shadow: var(--shadow-md);
    width: 100%;
    max-width: 440px;
    margin: 0 auto;
    padding: 1.25rem 1.25rem 1rem;
  }
</style>
</head>
<body>
  <div class="preview-card">
    <div class="menu-header">
      <div class="menu-avatar">S</div>
      <div style="min-width: 0;">
        <div class="menu-name">Sarah Marquez</div>
        <div class="menu-email muted small">sarah@example.com</div>
      </div>
    </div>
    <ul class="menu-list">
      <li><button type="button" class="menu-item">
        <span class="menu-icon"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg></span>
        <div class="menu-label">
          <div>Switch challenge</div>
          <div class="muted small">Round 1</div>
        </div>
        <span class="menu-chev">›</span>
      </button></li>
      <li><button type="button" class="menu-item">
        <span class="menu-icon"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>
        <div class="menu-label">
          <div>Edit profile</div>
          <div class="muted small">Display name</div>
        </div>
        <span class="menu-chev">›</span>
      </button></li>
      <li><button type="button" class="menu-item">
        <span class="menu-icon"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg></span>
        <div class="menu-label">
          <div>Edit custom goal</div>
          <div class="muted small">Read 30 mins</div>
        </div>
        <span class="menu-chev">›</span>
      </button></li>
      <li><button type="button" class="menu-item danger">
        <span class="menu-icon"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></span>
        <div class="menu-label"><div>Sign out</div></div>
        <span></span>
      </button></li>
    </ul>
  </div>
</body>
</html>
